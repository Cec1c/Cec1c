# 主页展示白名单：只有列在这里的仓库会出现在 README 的「近期项目 / 其他项目」区块。
#
# 维护方式：
#   - 加项目：在 featured（近期项目）或 others（其他项目）下面追加一条，改完提交即可。
#   - 调整顺序：直接拖动条目，README 里的展示顺序与这里一致。
#   - 新仓库会被 CI 自动发现并开 Issue 提醒，但不会自动上榜——必须写进这里才会展示。
#
# 字段说明：
#   repo          必填，owner/name
#   title_zh/en   卡片标题
#   desc_zh/en    卡片简介（长文案用 YAML 折叠块 >-，渲染时压平成一行）
#   extra_zh/en   可选的补充段落
#   links         可选的链接行，如在线示范
#   badge         release（默认，自动取最新 tag + stars）
#                 static （自定义文案徽章，如语言标签 + stars）
#                 stars  （只显示 stars）
#   release_color / badge_color / star_color  可选，覆盖徽章颜色
#
# ignore：永不收录、也永不触发新仓库提醒（自身仓库、fork、镜像、临时脚本）。

featured:
  - repo: Cec1c/codex-cli-ultra
    title_zh: Codex-Cli-Ultra
    title_en: Codex-Cli-Ultra
    alt_zh: Codex CLI Ultra
    alt_en: Codex CLI Ultra
    desc_zh: >-
      为 Codex CLI 提供外置 Fluent FTL 语言包、Windows / Linux / macOS 安装管理，以及可选的主题与状态栏扩展
      。当前参考语言包为简体中文，可通过 CCU Manager 管理安装和更新。
    desc_en: >-
      adds external Fluent FTL language packs, Windows / Linux / macOS installation management, and optional
      themes and status-line extensions to Codex CLI. Simplified Chinese is the reference language pack;
      CCU Manager handles installation and updates.

  - repo: Cec1c/Aletheia-Lens
    title_zh: Aletheia Lens
    title_en: Aletheia Lens
    desc_zh: >-
      基于 ONNX Runtime 的本地图像修复工具，提供 Windows GUI 和 CPU / CUDA 12 打包版，支持文件夹与压缩包批处理
      、目录结构保留、自动遮罩识别和漫画去网点预处理。
    desc_en: >-
      is a local image restoration tool built on ONNX Runtime, with a Windows GUI and CPU / CUDA 12 packages.
      It supports folder and archive batches, preserved directory structures, automatic mask detection, and
      optional manga descreening.
    extra_zh: 实验性手动标注修复已加入，目前仅支持静态单图片和模式 I。
    extra_en: Experimental manual mask editing is available for single static images in mode I.

  - repo: Cec1c/ERPNext-MCP
    title_zh: ERPNext-MCP
    title_en: ERPNext-MCP
    alt_zh: ERPNext MCP
    alt_en: ERPNext MCP
    desc_zh: >-
      面向 ERPNext / Frappe 的 MCP 服务，支持原生 HTTP API、文档与报表查询，以及制造和库存流程追踪
      。默认启用 Safe Mode，敏感操作按确认后的固定计划执行，大型请求和响应可完整保存、分段读取。
    desc_en: >-
      connects AI agents to ERPNext / Frappe through native HTTP APIs, document and report queries, and
      manufacturing and stock tracing. Safe Mode is enabled by default; sensitive operations use approved,
      frozen plans, while large requests and responses remain available in full.
    badge: static
    badge_label: Python
    badge_message: MCP+Server
    badge_color: "9c55d4"

  - repo: Cec1c/PVF-MCP
    title_zh: PVF-MCP
    title_en: PVF-MCP
    desc_zh: >-
      是面向 pvfUtility 的 Go MCP Server，以 26 个工具覆盖 PVF 搜索、结构化编辑、序列化和保存流程
      。支持读取编辑器当前文档与选中文件，通过 stdio 接入 AI 客户端。
    desc_en: >-
      is a Go MCP server for pvfUtility, exposing 26 tools for PVF search, structured editing, serialization,
      and saving. It can read the editor’s current document and selected files, and connects to AI clients
      over stdio.
    release_color: "d4772e"

  - repo: Cec1c/cpamp-theme-studio
    title_zh: CPAMP Theme Studio
    title_en: CPAMP Theme Studio
    desc_zh: >-
      为 CPA Manager Plus 提供独立的主题工作室插件，可通过插件商店安装。支持预设配色、自定义强调色、明暗模式
      、字体、圆角与布局调整，实时预览并在浏览器中保存设置。
    desc_en: >-
      is a standalone theme studio plugin for CPA Manager Plus, available through the Plugin Store. It provides
      preset palettes, custom accent colors, light/dark modes, fonts, radii, and layout controls, with live
      preview and persistent browser preferences.

  - repo: Cec1c/Mansus
    title_zh: Mansus
    title_en: Mansus
    desc_zh: 是基于 Firefly 二次开发的 Astro 博客模板，支持准则墨水混色、Markdown / MDX、全文搜索和 GitHub Pages 快速部署。
    desc_en: >-
      is an Astro blog template based on Firefly, with aspect-based ink mixing, Markdown / MDX, full-text
      search, and quick GitHub Pages deployment.
    links:
      - url: https://mansus.cc
        label_zh: 在线示范
        label_en: Live demo
    badge: static
    badge_label: Astro
    badge_message: blog+template
    badge_color: "d4772e"

others:
  - repo: Cec1c/iaintnorobot
    title_zh: I Ain't No Robot
    title_en: I Ain't No Robot
    desc_zh: >-
      面向 AstrBot 的多群自然插话插件，目标是让机器人少说、短说、偶尔接一句。支持多群 WebUI 配置、SQLite
      轻量记忆、低频触发与冷却、话题优先判断、随机延迟和人味短句过滤，不依赖任何外部服务。
    desc_en: >-
      is a multi-group chat interjection plugin for AstrBot whose goal is a bot that speaks less, shorter, and
      occasionally, like an ordinary group member. It configures groups through a WebUI, keeps lightweight
      SQLite memory, and adds cooldowns, topic-first triggering, randomized delays, and human-sounding short
      replies without any external service.
    badge: stars

  - repo: Cec1c/Survey
    title_zh: Survey
    title_en: Survey
    desc_zh: >-
      面向 IDA Pro 的 LLM 逆向分析助手，提供 GUI + CLI 双入口，通过 MCP Bridge 读取反编译、交叉引用和内存数据
      ，辅助重命名、注释与类型整理。
    desc_en: >-
      is an LLM-powered reverse engineering assistant for IDA Pro with GUI and CLI entry points. Its MCP Bridge
      provides decompilation, cross-references, and memory data, plus tools for renaming, annotation, and type
      cleanup.
    badge: static
    badge_label: Python
    badge_message: IDA+Pro
    badge_color: "d4772e"

  - repo: Cec1c/DeepCreamPy-Batch-Processor
    title_zh: DeepCreamPy Batch Processor
    title_en: DeepCreamPy Batch Processor
    desc_zh: >-
      早期的批量图像修复脚本，基于 DeepCreamPy FastAPI，支持目录结构与透明图层保留。已停止更新
      ，后续开发转至 <a href="https://github.com/Cec1c/Aletheia-Lens">Aletheia Lens</a>。
    desc_en: >-
      is an earlier batch image restoration script based on DeepCreamPy FastAPI, with support for preserved
      directory structures and transparency. It is no longer maintained; development continues in
      <a href="https://github.com/Cec1c/Aletheia-Lens">Aletheia Lens</a>.
    badge: stars

