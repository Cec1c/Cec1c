# 主页代表作白名单：列在 featured 里的仓库会按顺序渲染到主页「造物 · WORKS」Bento 画布（每行两张磁贴）。
#
# 维护方式：
#   - 增删或调序：直接编辑 featured 列表，CI 每日自动同步最新 stars、Release tag 与主语言，重绘 SVG 磁贴与 README。
#   - 新仓库建仓满 7 天会被 CI 扫描并开 Issue 提醒，但不会自动上榜。
#
# 字段说明：
#   repo            必填，owner/name
#   slug            可选，SVG 文件名后缀（默认取仓库名小写）
#   title_zh/en     卡片标题
#   aspect          可选，winter / lantern / knock（不填则按拉丁方自动轮转，避免相邻同色）
#   language        可选，覆盖底部首枚语言铭牌文案（不填则自动取 GitHub 主语言）
#   language_color  可选，首枚语言铭牌菱点颜色（十六进制）
#   badge           release（默认，第 2 枚铭牌自动显示最新 Release tag）
#                   static （第 2 枚铭牌显示固定 tag2 文案，适合无 Release 或 tag 过长的仓库）
#                   stars  （不显示第 2 枚版本铭牌）
#   tag2            static 模式下的第 2 枚铭牌文案
#   tag3            可选，第 3 枚能力/技术栈铭牌文案
#   lines_zh/en     可选，精确指定两行简介折行；不填则由 desc_zh / desc_en 自动按宽度折成两行

featured:
  - repo: Cec1c/Aletheia-Lens
    slug: aletheia-lens
    title_zh: Aletheia-Lens
    title_en: Aletheia-Lens
    aspect: winter
    language: Python
    language_color: "#4B8BBE"
    badge: release
    tag3: "ONNX · CUDA 12"
    lines_zh:
      - "基于 ONNX Runtime（CPU / CUDA 12）的动漫插画"
      - "批量修复 GUI，支持压缩包直读、自动遮罩检测与去网点。"
    lines_en:
      - "Anime illustration batch restoration GUI powered by ONNX"
      - "Runtime (CPU / CUDA 12): archive read, auto-mask & descreen."

  - repo: Cec1c/ServerS5A3
    slug: servers5a3
    title_zh: ServerS5A3
    title_en: ServerS5A3
    aspect: knock
    language: Go
    language_color: "#58B9D0"
    badge: static
    tag2: "Linux · Docker"
    lines_zh:
      - "复古横版动作游戏的 Go Linux 服务端与存档核心，"
      - "支持容器化部署、120 频道表校验与活动热配置。"
    lines_en:
      - "Go Linux server & persistence core for a retro side-scrolling"
      - "action game: Docker deploy, 120-channel checks & hot events."

  - repo: Cec1c/PurpleMagic
    slug: purplemagic
    title_zh: PurpleMagic
    title_en: PurpleMagic
    aspect: lantern
    language: "Go · Flutter · React"
    language_color: "#c9b458"
    badge: static
    tag2: "Web GM"
    lines_zh:
      - "配套 ServerS5A3 的玩家登录器、更新分发网关与"
      - "Web GM 管理台（账号、邮件、活动与持久福利）。"
    lines_en:
      - "Player launcher, update distribution gateway & Web GM console"
      - "for ServerS5A3 (accounts, mail, live events & perks)."

  - repo: Cec1c/MortarHUD
    slug: mortarhud
    title_zh: MortarHUD
    title_en: MortarHUD
    aspect: winter
    language: "C# · WPF / .NET 10"
    language_color: "#5ca36c"
    badge: release
    tag3: "OpenCV · Tesseract"
    lines_zh:
      - "《Wardogs》透明置顶迫击炮 HUD，通过 OpenCV 与"
      - "Tesseract 读屏实时解算地图方位角与距离。"
    lines_en:
      - "Transparent always-on-top Wardogs mortar HUD solving map"
      - "azimuth & range in real time via OpenCV & Tesseract."

  - repo: Cec1c/PVF-MCP
    slug: pvf-mcp
    title_zh: PVF-MCP
    title_en: PVF-MCP
    aspect: knock
    language: Go
    language_color: "#58B9D0"
    badge: release
    tag3: "stdio MCP"
    lines_zh:
      - "面向 pvfUtility 的 stdio MCP 服务端，提供 26 个"
      - "工具完成 PVF 检索、结构化编辑与当前文档读取。"
    lines_en:
      - "stdio MCP server for pvfUtility exposing 26 tools for PVF"
      - "archive search, structured editing & active document read."

  - repo: Cec1c/codex-cli-ultra
    slug: codex-cli-ultra
    title_zh: codex-cli-ultra
    title_en: codex-cli-ultra
    aspect: lantern
    language: "JS / Rust"
    language_color: "#d19a77"
    badge: release
    tag3: "Fluent FTL"
    lines_zh:
      - "Codex CLI 跨平台安装与扩展管理器，支持外置"
      - "Fluent FTL 中文语言包、终端主题与状态栏扩展。"
    lines_en:
      - "Cross-platform installer & extension manager for Codex CLI"
      - "with external Fluent FTL zh-CN packs, themes & status bar."

# language_ignore：不作为自动主语言显示的非代码资源格式（自动顺延到下一门语言）。
language_ignore:
  - Fluent

# ignore：不在主页代表作展示、也不触发新仓库提醒（自身仓库、博客模板、早期实验与归档仓库）。
ignore:
  - Cec1c/Cec1c
  - Cec1c/Mansus
