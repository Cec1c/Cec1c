# 「开源贡献 · UPSTREAM」区块的文案覆盖源。
#
# 外部仓库列表、仓库星标数与已合并 PR 编号由 CI 实时抓取，这里负责提供精炼的中英文概述。
# 支持直接用 lines_zh / lines_en 指定两行折行，或用 takeaway_zh / takeaway_en 自动折行；
# 未在此配置的外部仓库若出现新的 merged PR，会自动降级使用最新 PR 标题并按宽度折行。

repos:
  Kuddev/pebrel:
    order: 1
    slug: pebrel
    takeaway_zh: 平滑光标轨迹契约与外观配置持久化
    takeaway_en: Smooth cursor trail contract & appearance config persistence
    lines_zh:
      - "平滑光标轨迹契约与"
      - "外观配置持久化"
    lines_en:
      - "Smooth cursor trail contract &"
      - "appearance config persistence"

  seakee/CPA-Manager-Plus:
    order: 2
    slug: cpamp
    takeaway_zh: 修复插件资源代理的未授权管理密钥提权问题
    takeaway_en: Fix unauthorized admin-key escalation in plugin asset proxy
    lines_zh:
      - "修复插件资源代理的未授权"
      - "管理密钥提权问题"
    lines_en:
      - "Fix unauthorized admin-key"
      - "escalation in plugin asset proxy"

  taekchef/claude-code-zh-cn:
    order: 3
    slug: cc-zh
    takeaway_zh: Windows PowerShell 安装器、Hook / Launcher 与界面翻译
    takeaway_en: Windows PowerShell installer, Hook / Launcher & UI translation
    lines_zh:
      - "Windows PowerShell 安装器、"
      - "Hook / Launcher 与界面翻译"
    lines_en:
      - "Windows PowerShell installer,"
      - "Hook / Launcher & UI translation"
