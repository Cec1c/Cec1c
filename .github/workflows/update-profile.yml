name: Update Profile README

# 每天北京时间 06:00 刷新主页的「造物 / 开源贡献」两个受管区块与配套深浅色 SVG 磁贴。
# 数据没变化时不会产生提交。
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 提交 README 与受管 SVG
      issues: write # 开「发现未收录仓库」提醒

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Test profile updater
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Refresh README and Bento SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_PAT: ${{ secrets.PROFILE_PAT }}
        run: python scripts/update_profile.py

      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain README.md README.en.md assets/)" ]; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md assets/
          git commit -m "chore: 自动刷新主页项目与贡献数据"
          git push
